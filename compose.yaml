services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: todo-client
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - todo-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todo-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - todo-network

  mongo:
    image: mongo:8
    container_name: todo-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-network

volumes:
  mongo-data:

networks:
  todo-network:
    driver: bridge
